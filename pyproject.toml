[project]
name = "shophub"
version = "0.1.0"
description = "ShopHub multi-tenant support assistant: LangGraph orchestrator, A2A orders sub-agent, mock store API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.23",
    "pydantic>=2.14.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
